[bootstrap.mise_shell_activate]
fish = "auto"

[bootstrap.packages]
'brew:fish' = 'latest'
'brew-cask:ghostty' = { os = ['macos']}
'dnf:ghostty' = {os = ["linux"]}

[env]
EDITOR = "nvim"

[tools]
go = "1.27"
"go:golang.org/x/tools/gopls" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
uv = "latest"
rust-analyzer = "latest"
npm = "latest"
stylua = "latest"
lua-language-server = "latest"
neovim = "nightly"
zellij = "latest"
jj = "latest"
jjui = "latest"

[dotfiles]
"~/.config/aerospace" = { mode = "track" }
"~/.config/ghostty" = { mode = "track" }
"~/.config/jj/config.toml" = {}
"~/.config/mise/config.toml" = { mode = "track" }
"~/.config/nvim" = { mode = "track" }
"~/.config/zellij" = { mode = "track" }

[bootstrap.services.mise-history]
builtin = "history-watch"

[shell_alias]
js = "jj show"
jf = "jj git fetch"
jn = "jj new"
jbt = "jj bookmark track"
jba = "jj bookmark advance"
jblr = "jj bookmark list --remote origin"
jbl = "jj bookmark list"
je = "jj edit"
jr = "jj rebase"
jrbd = "jj rebase -b @ -o dev@origin"
jd = "jj describe"
jc = "jj commit"
jp = "jj git push"
jnd = "jj new dev@origin"
