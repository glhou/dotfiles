# Chemin du fichier : ~/.config/kitty/kitty.conf

# Police
font_family FiraCode Nerd Font SemBd
font_size        16.0

# Couleurs (Thème One Dark)
include latte.conf

# Cursor
cursor_shape block
# cursor_blink_interval  0.6
shell_integration enabled no-cursor

# Scrolling
scrollback_lines 10000

# Layout
enabled_layouts splits

# Leader map
kitty_mod ctrl+b

# Window Keyboard
map kitty_mod>t>n launch
map kitty_mod>t>r set_tab_title
map --allow-fallback=shifted,ascii kitty_mod>t>x close_tab

# Move Pane Focus
map kitty_mod+h move_window left
map kitty_mod+j move_window down
map kitty_mod+k move_window up
map kitty_mod+l move_window right

# Tab Management
map kitty_mod>0 goto_tab 1
map kitty_mod>1 goto_tab 2
map kitty_mod>2 goto_tab 3
map kitty_mod>3 goto_tab 4
map ctrl+b>4 goto_tab 5
map ctrl+b>5 goto_tab 6
map ctrl+b>6 goto_tab 7
map ctrl+b>7 goto_tab 8
map ctrl+b>8 goto_tab 9
map ctrl+b>9 goto_tab 10
