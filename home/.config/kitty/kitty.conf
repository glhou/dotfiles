# Chemin du fichier : ~/.config/kitty/kitty.conf

# Police
font_family FiraCode Nerd Font SemBd
font_size        16.0

# Couleurs (Thème One Dark)
include latte.conf

# Cursor
cursor_shape block
# cursor_blink_interval  0.6
shell_integration enabled no-cursor

# Scrolling
scrollback_lines 10000

# Layout
enabled_layouts splits

# Window Keyboard
map ctrl+b>t>n new_tab
map ctrl+b>t>r set_tab_title
map ctrl+b>t>x close_tab


# Pane
map ctrl+b>p>n new_window
map ctrl+b>p>x close_window
map ctrl+b>z focus_visible_window

# Move Pane Focus
map ctrl+b>h previous_window
map ctrl+b>l next_window

# Tab Management
map ctrl+b>0 goto_tab 1
map ctrl+b>1 goto_tab 2
map ctrl+b>2 goto_tab 3
map ctrl+b>3 goto_tab 4
map ctrl+b>4 goto_tab 5
map ctrl+b>5 goto_tab 6
map ctrl+b>6 goto_tab 7
map ctrl+b>7 goto_tab 8
map ctrl+b>8 goto_tab 9
map ctrl+b>9 goto_tab 10
