# Chemin du fichier : ~/.config/kitty/kitty.conf

# Police
font_family FiraCode Nerd Font SemBd
font_size        16.0

# Color
include latte.conf

# Cursor
cursor_shape block
# shell_integration no-cursor

allow_remote_control yes

# Copy on select
copy_on_select yes

# Scrolling
scrollback_lines 10000

# Layout
enabled_layouts splits,stack

# Display the current active session name
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{secure_input_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{title}@{session_name}"

# kitty tab only shows tabs from the currently active session
tab_bar_filter session:~ or session:^$

# set default session
startup_session ~/.config/kitty/default.session

# Save current session
restore_session_after_logout yes

remember_window_position no

#### KEYBINDS

# Window Keyboard
map ctrl+b>t>n new_tab_with_cwd
map ctrl+b>t>r set_tab_title
map ctrl+b>t>x close_tab


# Pane
map ctrl+b>p>n new_window_with_cwd
map ctrl+b>p>x close_window
map ctrl+b>z toggle_layout stack

# Move Pane Focus
map ctrl+b>h previous_window
map ctrl+b>l next_window

# Tab Management
map ctrl+b>0 goto_tab 1
map ctrl+b>1 goto_tab 2
map ctrl+b>2 goto_tab 3
map ctrl+b>3 goto_tab 4
map ctrl+b>4 goto_tab 5
map ctrl+b>5 goto_tab 6
map ctrl+b>6 goto_tab 7
map ctrl+b>7 goto_tab 8
map ctrl+b>8 goto_tab 9
map ctrl+b>9 goto_tab 10

# Session
map ctrl+b>s kitten ~/.config/kitty/session_picker.py
map ctrl+b>o>a goto_session --active-only --sort-by=alphabetical
map ctrl+b>o>x close_session
map ctrl+b>o>d goto_session ~/.config/kitty/default.session
