# Chemin du fichier : ~/.config/kitty/kitty.conf

# Police
font_family FiraCode Nerd Font SemBd
font_size        16.0

# Couleurs (Thème One Dark)
include latte.conf

# Cursor
cursor_shape block
# cursor_blink_interval  0.6
shell_integration enabled no-cursor

# Scrolling
scrollback_lines 10000

# Layout
enabled_layouts splits

# Leader map
kitty_mod ctrl+shift

# Window Keyboard
map kitty_mod>t>n launch
map kitty_mod>t>r set_tab_title
map kitty_mod>t>x close_tab


# Pane
map kitty_mod>p>n new_window
map kitty_mod>z focus_visible_window

# Move Pane Focus
map kitty_mod>h neighboring_window left
map kitty_mod>j neighboring_window down
map kitty_mod>k neighboring_window up
map kitty_mod>l neighboring_window right

# Tab Management
map kitty_mod>0 goto_tab 1
map kitty_mod>1 goto_tab 2
map kitty_mod>2 goto_tab 3
map kitty_mod>3 goto_tab 4
map kitty_mod>4 goto_tab 5
map kitty_mod>5 goto_tab 6
map kitty_mod>6 goto_tab 7
map kitty_mod>7 goto_tab 8
map kitty_mod>8 goto_tab 9
map kitty_mod>9 goto_tab 10
