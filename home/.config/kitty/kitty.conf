# Chemin du fichier : ~/.config/kitty/kitty.conf

# Police
font_family FiraCode Nerd Font SemBd
font_size        16.0

# Couleurs (Thème One Dark)
include latte.conf

# Cursor
cursor_shape block
# cursor_blink_interval  0.6
shell_integration enabled no-cursor

# Scrolling
scrollback_lines 10000

# Layout
enabled_layouts splits


# Keyboard mappings exemple (Ctrl + Shift + C pour copier)
map --allow-fallback=shifted,ascii ctrl+shift+c copy_to_clipboard
map --allow-fallback=shifted,ascii cmd+c copy_or_noop 🍎
map --allow-fallback=shifted,ascii ctrl+shift+v paste_from_clipboard
map --allow-fallback=shifted,ascii cmd+v paste_from_clipboard 🍎
map --allow-fallback=shifted,ascii ctrl+shift+s paste_from_selection
map shift+insert paste_from_selection
map --allow-fallback=shifted,ascii ctrl+shift+o pass_selection_to_program

# Window Keyboard
map ctrl+n launch

# Tab Management
map ctrl>0 goto_tab 1
map ctrl+alt+1 goto_tab 2
map ctrl+alt+2 goto_tab 3
map ctrl+alt+3 goto_tab 4
map ctrl+alt+4 goto_tab 5
map ctrl+alt+5 goto_tab 6
map ctrl+alt+6 goto_tab 7
map ctrl+alt+7 goto_tab 8
map ctrl+alt+8 goto_tab 9
map ctrl+alt+9 goto_tab 10
